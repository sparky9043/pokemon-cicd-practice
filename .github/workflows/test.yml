name: Testing stuff

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  a_test_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: github context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - name: commits
        env:
          COMMITS: ${{ toJson(github.event.commits) }}
        run: echo "$COMMITS"
      - name: commit messages
        env:
          COMMIT_MESSAGES: ${{ toJson(github.event.commits.*.message) }}
        run: echo "$COMMIT_MESSAGES"
      - name: Test contain file
        if: ${{ contains( toJSon(github.event.commits.*.message), '#skip') }}
        run: echo "commit message contains skip"
      - name: Testing pull request access
        if: ${{ github.event_name == 'pull_request' && contains( toJson(github.event.commits.*.message), '#skip') }}
        run: echo "Pull request contains skip command"